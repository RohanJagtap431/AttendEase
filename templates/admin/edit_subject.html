
{% extends 'admin/base_admin.html' %}

{% block title %}Edit Subject | AttendEase{% endblock %}
{% block page_title %}Edit Subject{% endblock %}

{% block content %}

<div class="subject-form-card">

    <div class="subject-form-heading">
        <div class="subject-form-icon">✎</div>
        <div>
            <h2>Edit Subject</h2>
            <p>Update subject information and details.</p>
        </div>
    </div>

    <form method="POST" autocomplete="off">
        {% csrf_token %}

        <div class="subject-form-grid">

            <div class="subject-field">
                <label for="name">Subject Name <span>*</span></label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ subject.name }}"
                    placeholder="Enter subject name"
                    maxlength="100"
                    required
                >
            </div>

            <div class="subject-field">
                <label for="code">Subject Code <span>*</span></label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    value="{{ subject.code }}"
                    placeholder="Enter subject code"
                    maxlength="20"
                    required
                >
            </div>

            <div class="subject-field subject-full-width">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    placeholder="Enter subject description..."
                >{{ subject.description }}</textarea>
            </div>

        </div>

        <div class="subject-form-actions">

            <a href="{% url 'manage_subjects' %}"
               class="subject-cancel-btn">
                Cancel
            </a>

            <button type="submit" class="subject-submit-btn">
                Update Subject
            </button>

        </div>

    </form>

</div>

{% endblock %}
